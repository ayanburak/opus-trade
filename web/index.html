<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opus Trading Masası</title>
  <link rel="icon" type="image/svg+xml" href="static/favicon.svg">
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="pair-box">
      <button class="pair-picker" id="pairPicker" aria-haspopup="listbox" aria-expanded="false">
        <img class="pair-icon" id="pairIcon" src="static/vendor/icons/btc.svg" alt="">
        <div class="pair-text">
          <div class="pair-name"><span id="pairName">BTC/USDT</span><span class="caret">▾</span></div>
          <div class="brand-sub" id="subtitle">Opus Trading Masası</div>
        </div>
      </button>
      <div class="pair-list" id="pairList" role="listbox" hidden></div>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-label">Fiyat</span>
        <span class="stat-value big" id="price">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">Özkaynak</span>
        <span class="stat-value" id="equity">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">Opus getirisi</span>
        <span class="stat-value" id="return">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">Açık K/Z</span>
        <span class="stat-value" id="upnl">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">İşlemler</span>
        <span class="stat-value" id="tradeCount">—</span>
      </div>
    </div>

    <div class="top-right">
      <a class="legal-link" href="details/yasal-uyari" title="Yasal uyarının tam metni">
        <svg class="ic" aria-hidden="true"><use href="static/icons.svg#scale"/></svg>
        <span><b>Yasal Uyarı</b><small>Yatırım tavsiyesi değildir</small></span>
      </a>
      <a class="details-link" href="details/" title="Projenin nasıl çalıştığını anlatan sayfa">
        <svg class="ic" aria-hidden="true"><use href="static/icons.svg#info"/></svg>Hakkında
      </a>
      <div class="profile-box">
        <button class="profile-picker" id="profilePicker" aria-haspopup="listbox" aria-expanded="false"></button>
        <div class="profile-list" id="profileList" role="listbox" hidden></div>
      </div>
    </div>
  </header>

  <main class="grid">
    <section class="left">
      <div class="panel chart-panel">
        <div class="chart-top">
          <div class="intervals" id="intervals">
            <button data-interval="1m">1dk</button>
            <button data-interval="5m">5dk</button>
            <button data-interval="15m" class="selected">15dk</button>
            <button data-interval="1h">1sa</button>
            <button data-interval="4h">4sa</button>
            <button data-interval="1d">1g</button>
          </div>
          <div class="layer-box">
            <button class="tool-button" id="layerButton" aria-haspopup="true" aria-expanded="false" title="Grafikte gösterilenleri seç">
              <svg class="ic" aria-hidden="true"><use href="static/icons.svg#filter"/></svg>Grafik<span class="caret">▾</span>
            </button>
            <div class="layer-menu" id="layerMenu" hidden></div>
          </div>
          <div class="legend" id="legend">
            <span data-layer="entry"><i class="l-entry"></i>Giriş</span>
            <span data-layer="tp"><i class="l-tp"></i>TP</span>
            <span data-layer="sl"><i class="l-sl"></i>SL</span>
            <span data-layer="liq"><i class="l-liq"></i>Likidasyon</span>
            <span data-layer="orders"><i class="l-order"></i>Emir</span>
            <span data-layer="alerts"><i class="l-alert"></i>Alarm</span>
          </div>
        </div>
        <div class="chart-area">
          <div id="chart"></div>
          <button class="fullscreen-button" id="fullscreenButton" title="Grafiği tam ekran yap" aria-pressed="false">
            <svg class="ic" aria-hidden="true"><use href="static/icons.svg#maximize"/></svg>
          </button>
        </div>
      </div>

      <div class="panel bottom-panel">
        <nav class="tabs" id="tabs">
          <button data-tab="positions" class="selected">Pozisyonlar <b id="posCount">0</b></button>
          <button data-tab="orders">Bekleyen emirler <b id="orderCount">0</b></button>
          <button data-tab="alerts">Alarmlar <b id="alertCount">0</b></button>
          <button data-tab="history">Geçmiş işlemler <b id="historyCount">0</b></button>
          <button data-tab="notebook">Opus'un not defteri</button>
        </nav>
        <div class="tab-content" id="tabContent"></div>
      </div>
    </section>

    <aside class="panel journal">
      <div class="journal-top">
        <h2>Günlük</h2>
        <span class="journal-count" id="journalCount">0 karar</span>
      </div>
      <div class="journal-list" id="journal"></div>
    </aside>
  </main>

  <div class="closed-screen" id="closedScreen" hidden>
    <div>
      <svg class="ic closed-icon" aria-hidden="true"><use href="static/icons.svg#power"/></svg>
      <h3>Program kapandı</h3>
      <p>Bütün profillerin son kararı uygulandı. Program yeniden açıldığında kapalı kalınan süre işlenir ve Opus'a bildirilir.</p>
    </div>
  </div>

  <script src="static/vendor/lightweight-charts.js"></script>
  <script src="static/app.js"></script>
</body>
</html>
